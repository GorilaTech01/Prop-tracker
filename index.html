<style>
/* ============================================================
   Prop Tracker — sistema de diseño
   Paleta: terminal de trading nocturno, cálido en vez de acid-green.
   Tipografía: Space Grotesk (UI) + IBM Plex Mono (cifras, tabular).
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');

:root {
  /* Base */
  --bg-base: #0E1015;
  --bg-surface: #171A21;
  --bg-elevated: #1E222C;
  --bg-pressed: #262B37;
  --border-hairline: #2A2F3B;
  --border-strong: #3A4051;

  /* Texto */
  --text-primary: #ECEEF3;
  --text-secondary: #9AA1B2;
  --text-tertiary: #6B7180;

  /* Marca (uso deliberado, no decorativo) */
  --accent: #D4A24C;
  --accent-dim: #8A6B33;
  --accent-bg: rgba(212, 162, 76, 0.12);

  /* Semántico — nunca es el único indicador, siempre va con texto/ícono */
  --safe: #34C77A;
  --safe-bg: rgba(52, 199, 122, 0.12);
  --warning: #E8B93E;
  --warning-bg: rgba(232, 185, 62, 0.12);
  --danger: #F0554A;
  --danger-bg: rgba(240, 85, 74, 0.12);
  --neutral: #6B7180;
  --neutral-bg: rgba(107, 113, 128, 0.12);

  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;

  --font-ui: 'Space Grotesk', -apple-system, system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', 'SF Mono', Menlo, monospace;

  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg-base);
  color: var(--text-primary);
  font-family: var(--font-ui);
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
}

#app {
  max-width: 520px;
  margin: 0 auto;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  position: relative;
}

button, input, select, textarea {
  font-family: inherit;
  color: inherit;
}

a { color: inherit; text-decoration: none; }

.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* ---------- Header de pantalla ---------- */
.screen {
  padding: calc(20px + var(--safe-top)) 18px 96px;
  flex: 1;
}

.screen-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 18px;
}

.screen-title {
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.screen-subtitle {
  font-size: 13px;
  color: var(--text-secondary);
  margin-top: 2px;
}

/* ---------- Hero de balance (Home) ---------- */
.balance-hero {
  padding: 4px 2px 20px;
  border-bottom: 1px solid var(--border-hairline);
  margin-bottom: 18px;
}

.balance-hero .label {
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 6px;
}

.balance-hero .amount {
  font-family: var(--font-mono);
  font-size: 40px;
  font-weight: 600;
  letter-spacing: -0.02em;
  line-height: 1.1;
}

.balance-hero .delta {
  margin-top: 6px;
  font-size: 15px;
  font-family: var(--font-mono);
}

.delta.pos { color: var(--safe); }
.delta.neg { color: var(--danger); }
.delta.flat { color: var(--text-secondary); }

/* ---------- Barra de progreso ---------- */
.progress-block { margin: 14px 0; }

.progress-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-size: 13px;
  margin-bottom: 6px;
}

.progress-row .title { color: var(--text-secondary); }
.progress-row .value { font-family: var(--font-mono); font-weight: 500; }

.progress-track {
  height: 8px;
  background: var(--bg-elevated);
  border-radius: 999px;
  overflow: hidden;
  border: 1px solid var(--border-hairline);
}

.progress-fill {
  height: 100%;
  border-radius: 999px;
  transition: width 0.4s ease;
}

.progress-fill.safe { background: var(--safe); }
.progress-fill.warning { background: var(--warning); }
.progress-fill.danger { background: var(--danger); }
.progress-fill.accent { background: var(--accent); }

/* ---------- Grid de métricas ---------- */
.metric-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1px;
  background: var(--border-hairline);
  border: 1px solid var(--border-hairline);
  border-radius: var(--radius-md);
  overflow: hidden;
  margin-bottom: 18px;
}

.metric-cell {
  background: var(--bg-surface);
  padding: 14px;
}

.metric-cell .label {
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: 4px;
}

.metric-cell .value {
  font-family: var(--font-mono);
  font-size: 19px;
  font-weight: 600;
}

/* ---------- Badge de estado ---------- */
.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
}

.status-badge.safe { background: var(--safe-bg); color: var(--safe); }
.status-badge.warning { background: var(--warning-bg); color: var(--warning); }
.status-badge.danger { background: var(--danger-bg); color: var(--danger); }
.status-badge.rule_violated { background: var(--danger-bg); color: var(--danger); }
.status-badge.neutral { background: var(--neutral-bg); color: var(--neutral); }

.status-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: currentColor;
}

/* ---------- Card ---------- */
.card {
  background: var(--bg-surface);
  border: 1px solid var(--border-hairline);
  border-radius: var(--radius-md);
  padding: 16px;
  margin-bottom: 14px;
}

.card-title {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 10px;
  color: var(--text-primary);
}

/* ---------- Botones ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 13px 18px;
  border-radius: var(--radius-sm);
  border: none;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  width: 100%;
}

.btn-primary { background: var(--accent); color: #191204; }
.btn-primary:active { background: var(--accent-dim); }

.btn-secondary {
  background: var(--bg-elevated);
  color: var(--text-primary);
  border: 1px solid var(--border-strong);
}
.btn-secondary:active { background: var(--bg-pressed); }

.btn-ghost {
  background: transparent;
  color: var(--text-secondary);
  border: 1px solid var(--border-hairline);
}

.btn-danger { background: var(--danger-bg); color: var(--danger); border: 1px solid rgba(240,85,74,0.3); }

.btn-block { width: 100%; }
.btn-row { display: flex; gap: 10px; }
.btn-row .btn { flex: 1; }

/* ---------- Formularios ---------- */
.field { margin-bottom: 14px; }

.field label {
  display: block;
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 6px;
}

.field input[type="text"],
.field input[type="number"],
.field input[type="date"],
.field input[type="time"],
.field select,
.field textarea {
  width: 100%;
  background: var(--bg-elevated);
  border: 1px solid var(--border-hairline);
  border-radius: var(--radius-sm);
  padding: 12px 12px;
  font-size: 15px;
  color: var(--text-primary);
}

.field textarea { min-height: 72px; resize: vertical; }

.field input:focus, .field select:focus, .field textarea:focus {
  outline: none;
  border-color: var(--accent);
}

.field-hint { font-size: 12px; color: var(--text-tertiary); margin-top: 4px; }

.segmented {
  display: flex;
  background: var(--bg-elevated);
  border: 1px solid var(--border-hairline);
  border-radius: var(--radius-sm);
  padding: 3px;
  gap: 3px;
}

.segmented button {
  flex: 1;
  background: transparent;
  border: none;
  padding: 10px 8px;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-secondary);
}

.segmented button.active {
  background: var(--bg-pressed);
  color: var(--text-primary);
}

.segmented button.active.buy { color: var(--safe); }
.segmented button.active.sell { color: var(--danger); }

.chip-group { display: flex; flex-wrap: wrap; gap: 8px; }

.chip {
  padding: 8px 12px;
  border-radius: 999px;
  border: 1px solid var(--border-hairline);
  background: var(--bg-elevated);
  font-size: 13px;
  color: var(--text-secondary);
}

.chip.active {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-bg);
}

.collapsible-toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 2px;
  color: var(--text-secondary);
  font-size: 14px;
  font-weight: 500;
}

/* ---------- Navegación inferior ---------- */
.tabbar {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 520px;
  background: rgba(23, 26, 33, 0.92);
  backdrop-filter: blur(16px);
  border-top: 1px solid var(--border-hairline);
  display: flex;
  align-items: center;
  padding: 8px 8px calc(8px + var(--safe-bottom));
  z-index: 50;
}

.tab-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 6px 0;
  background: none;
  border: none;
  color: var(--text-tertiary);
  font-size: 10.5px;
  font-weight: 500;
}

.tab-item.active { color: var(--accent); }

.tab-icon { width: 22px; height: 22px; }

.tab-item-fab {
  flex: 1;
  display: flex;
  justify-content: center;
}

.fab {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: -22px;
  border: 4px solid var(--bg-base);
  box-shadow: 0 4px 14px rgba(212, 162, 76, 0.35);
}

.fab svg { width: 22px; height: 22px; }

/* ---------- Calendario ---------- */
.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 5px;
}

.calendar-dow {
  text-align: center;
  font-size: 11px;
  color: var(--text-tertiary);
  padding-bottom: 6px;
}

.calendar-day {
  aspect-ratio: 1;
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  background: var(--bg-surface);
  border: 1px solid var(--border-hairline);
  font-size: 11px;
}

.calendar-day .daynum { color: var(--text-secondary); font-size: 11px; }
.calendar-day .daypnl { font-family: var(--font-mono); font-weight: 600; font-size: 10px; }

.calendar-day.profit { background: var(--safe-bg); border-color: rgba(52,199,122,0.35); }
.calendar-day.profit .daypnl { color: var(--safe); }
.calendar-day.loss { background: var(--danger-bg); border-color: rgba(240,85,74,0.35); }
.calendar-day.loss .daypnl { color: var(--danger); }
.calendar-day.breakeven { background: var(--warning-bg); border-color: rgba(232,185,62,0.35); }
.calendar-day.breakeven .daypnl { color: var(--warning); }
.calendar-day.empty { opacity: 0; pointer-events: none; }
.calendar-day.today { border-color: var(--accent); }

/* ---------- Journal / listas de trade ---------- */
.trade-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 13px 4px;
  border-bottom: 1px solid var(--border-hairline);
}

.trade-row:last-child { border-bottom: none; }

.trade-row .left { display: flex; flex-direction: column; gap: 3px; }
.trade-row .symbol { font-weight: 600; font-size: 15px; }
.trade-row .meta { font-size: 12px; color: var(--text-tertiary); }

<body>
<div id="app"></div>
<script type="module">
// ===== Prop Tracker — bundle único autogenerado a partir de /js (código fuente modular) =====

// ---- js/domain/money.js ----
// Todas las operaciones monetarias pasan por aquí. Enteros en centavos, nunca floats de dólares.

export function toCents(dollars) {
  return Math.round(Number(dollars) * 100);
}

export function fromCents(cents) {
  return cents / 100;
}

export function addCents(...values) {
  return values.reduce((sum, v) => sum + Math.round(v || 0), 0);
}

export function subtractCents(a, b) {
  return Math.round(a) - Math.round(b);
}

export function pctOfCents(cents, pct) {
  return Math.round((cents * pct) / 100);
}

// % que `part` representa de `whole`, evitando división por cero.
export function pctOf(part, whole) {
  if (!whole) return 0;
  return (part / whole) * 100;
}

export function formatCents(cents, currency = 'USD') {
  const dollars = fromCents(cents);
  const sign = dollars < 0 ? '-' : dollars > 0 ? '+' : '';
  const abs = Math.abs(dollars);
  const formatted = abs.toLocaleString('en-US', {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2,
  });
  const symbol = currency === 'USD' ? '$' : currency + ' ';
  return dollars === 0 ? `${symbol}${formatted}` : `${sign}${symbol}${formatted}`;
}

// Para montos absolutos (balance, límites, montos disponibles) — nunca antepone "+".
export function formatMoney(cents, currency = 'USD') {
  const dollars = fromCents(cents);
  const sign = dollars < 0 ? '-' : '';
  const abs = Math.abs(dollars);
  const formatted = abs.toLocaleString('en-US', {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2,
  });
  const symbol = currency === 'USD' ? '$' : currency + ' ';
  return `${sign}${symbol}${formatted}`;
}

export function formatPct(pct, decimals = 1) {
  const sign = pct > 0 ? '+' : '';
  return `${sign}${pct.toFixed(decimals)}%`;
}

export function clampPct(pct) {
  return Math.max(0, Math.min(100, pct));
}

// ---- js/domain/riskScore.js ----
// Puramente determinístico, sin IA. Basado en qué tan cerca está la cuenta de sus límites.

const ORDER = ['low', 'moderate', 'high', 'critical'];

function bucketFromPct(pct) {
  if (pct >= 90) return 'critical';
  if (pct >= 70) return 'high';
  if (pct >= 40) return 'moderate';
  return 'low';
}

function worst(levels) {
  return levels.reduce((acc, l) => (ORDER.indexOf(l) > ORDER.indexOf(acc) ? l : acc), 'low');
}

export function computeRiskScore({ dailyLossUsedPct, drawdownUsedPct, tradesToday, maxTradesPerDay, consecutiveLosses }) {
  const scores = [bucketFromPct(dailyLossUsedPct), bucketFromPct(drawdownUsedPct)];

  if (maxTradesPerDay) {
    scores.push(bucketFromPct((tradesToday / maxTradesPerDay) * 100));
  }

  if (consecutiveLosses >= 3) scores.push('critical');
  else if (consecutiveLosses === 2) scores.push('high');
  else if (consecutiveLosses === 1) scores.push('moderate');

  return worst(scores);
}

// ---- js/domain/drawdown.js ----

// Static drawdown: límite fijo sobre el starting balance; "usado" = caída máxima histórica
// del equity por debajo del starting balance (peor punto acumulado).
function staticDrawdown(account, rules, trades) {
  const limitCents = pctOfCents(account.startingBalanceCents, rules.maxOverallLossPct);

  const sorted = [...trades].sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  let running = account.startingBalanceCents;
  let lowestEquity = account.startingBalanceCents;
  for (const t of sorted) {
    running += t.pnlCents;
    if (running < lowestEquity) lowestEquity = running;
  }
  const usedCents = Math.max(0, account.startingBalanceCents - lowestEquity);
  const remainingCents = Math.max(0, limitCents - usedCents);
  const usedPct = limitCents === 0 ? 0 : (usedCents / limitCents) * 100;

  return { limitCents, usedCents, remainingCents, usedPct };
}

// Placeholders — mismo comportamiento que static por ahora (documentado en el diseño técnico).
// TODO: balance_based, equity_based y trailing tienen semánticas propias a futuro.
function balanceBasedDrawdown(account, rules, trades) {
  return staticDrawdown(account, rules, trades);
}
function equityBasedDrawdown(account, rules, trades) {
  return staticDrawdown(account, rules, trades);
}
function trailingDrawdown(account, rules, trades) {
  return staticDrawdown(account, rules, trades);
}

export function calculateDrawdown(account, rules, trades) {
  switch (rules.drawdownType) {
    case 'balance_based':
      return balanceBasedDrawdown(account, rules, trades);
    case 'equity_based':
      return equityBasedDrawdown(account, rules, trades);
    case 'trailing':
      return trailingDrawdown(account, rules, trades);
    case 'static':
    default:
      return staticDrawdown(account, rules, trades);
  }
}

// ---- js/domain/accountCalculation.js ----



export function calculateCurrentBalance(account, trades) {
  return addCents(account.startingBalanceCents, ...trades.map((t) => t.pnlCents));
}

export function getTradesForDate(trades, date) {
  return trades.filter((t) => t.date === date);
}

export function calculateDailyPnl(trades, date) {
  return addCents(...getTradesForDate(trades, date).map((t) => t.pnlCents));
}

export function countTradingDays(trades) {
  return new Set(trades.map((t) => t.date)).size;
}

export function calculateWinRate(trades) {
  const decisive = trades.filter((t) => t.result !== 'break_even');
  if (decisive.length === 0) return 0;
  const wins = decisive.filter((t) => t.result === 'win').length;
  return (wins / decisive.length) * 100;
}

// Un break_even no reinicia ni suma la racha; se ignora y se sigue mirando hacia atrás.
export function calculateConsecutiveLosses(trades) {
  const sorted = [...trades].sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  let streak = 0;
  for (let i = sorted.length - 1; i >= 0; i--) {
    const result = sorted[i].result;
    if (result === 'loss') streak++;
    else if (result === 'win') break;
  }
  return streak;
}

function determineStatus(dailyLossUsedPct, drawdownUsedPct, hasViolation) {
  if (hasViolation) return 'rule_violated';
  if (dailyLossUsedPct >= 90 || drawdownUsedPct >= 90) return 'danger';
  if (dailyLossUsedPct >= 50 || drawdownUsedPct >= 50) return 'warning';
  return 'safe';
}

export function calculateAccountSnapshot(account, rules, trades, { today, hasActiveViolation = false }) {
  const currentBalanceCents = calculateCurrentBalance(account, trades);
  const totalPnlCents = currentBalanceCents - account.startingBalanceCents;
  const returnPct = pctOf(totalPnlCents, account.startingBalanceCents);

  const dailyPnlCents = calculateDailyPnl(trades, today);
  const tradesToday = getTradesForDate(trades, today).length;

  // Daily loss se mide contra el equity de inicio del día (cierre del día anterior).
  const startOfDayEquity = currentBalanceCents - dailyPnlCents;
  const dailyLossLimitCents = pctOfCents(startOfDayEquity, rules.maxDailyLossPct);
  const dailyLossUsedCents = Math.max(0, -dailyPnlCents);
  const dailyLossRemainingCents = Math.max(0, dailyLossLimitCents - dailyLossUsedCents);
  const dailyLossUsedPct = pctOf(dailyLossUsedCents, dailyLossLimitCents);

  const drawdown = calculateDrawdown(account, rules, trades);

  const profitTargetCents = pctOfCents(account.startingBalanceCents, rules.profitTargetPct);
  const profitTargetProgressPct = Math.max(0, pctOf(totalPnlCents, profitTargetCents));

  const winRatePct = calculateWinRate(trades);
  const tradingDaysCount = countTradingDays(trades);
  const consecutiveLosses = calculateConsecutiveLosses(trades);

  const riskScore = computeRiskScore({
    dailyLossUsedPct,
    drawdownUsedPct: drawdown.usedPct,
    tradesToday,
    maxTradesPerDay: rules.maxTradesPerDay,
    consecutiveLosses,
  });

  const status = determineStatus(dailyLossUsedPct, drawdown.usedPct, hasActiveViolation);

  return {
    accountId: account.id,
    currentBalanceCents,
    totalPnlCents,
    returnPct,
    dailyPnlCents,
    tradesToday,
    dailyLossLimitCents,
    dailyLossUsedCents,
    dailyLossRemainingCents,
    dailyLossUsedPct,
    drawdownLimitCents: drawdown.limitCents,
    drawdownUsedCents: drawdown.usedCents,
    drawdownRemainingCents: drawdown.remainingCents,
    drawdownUsedPct: drawdown.usedPct,
    profitTargetCents,
    profitTargetProgressPct,
    winRatePct,
    tradingDaysCount,
    consecutiveLosses,
    riskScore,
    status,
  };
}

// ---- js/domain/propRuleEngine.js ----

function checkMaxTradesPerDay(snapshot, rules) {
  if (!rules.maxTradesPerDay) return null;
  const { tradesToday } = snapshot;
  const limit = rules.maxTradesPerDay;
  if (tradesToday > limit) {
    return {
      rule: 'max_trades_per_day',
      ruleSource: 'prop_firm',
      status: 'violation',
      message: `Superaste el límite de ${limit} trades hoy (llevas ${tradesToday}). Regla de la Prop Firm violada.`,
      value: tradesToday,
      limit,
    };
  }
  if (tradesToday === limit) {
    return {
      rule: 'max_trades_per_day',
      ruleSource: 'prop_firm',
      status: 'warning',
      message: 'Límite diario de trades alcanzado. No abras otra operación hoy.',
      value: tradesToday,
      limit,
    };
  }
  const remaining = limit - tradesToday;
  return {
    rule: 'max_trades_per_day',
    ruleSource: 'prop_firm',
    status: 'ok',
    message: `${remaining} trade${remaining === 1 ? '' : 's'} restante${remaining === 1 ? '' : 's'} hoy.`,
    value: tradesToday,
    limit,
  };
}

function checkMaxDailyLoss(snapshot) {
  const usedPct = snapshot.dailyLossUsedPct;
  if (snapshot.dailyLossUsedCents >= snapshot.dailyLossLimitCents && snapshot.dailyLossLimitCents > 0) {
    return {
      rule: 'max_daily_loss',
      ruleSource: 'prop_firm',
      status: 'violation',
      message: 'Se alcanzó o superó el límite de pérdida diaria permitida.',
      value: snapshot.dailyLossUsedCents,
      limit: snapshot.dailyLossLimitCents,
    };
  }
  if (usedPct >= 75) {
    return {
      rule: 'max_daily_loss',
      ruleSource: 'prop_firm',
      status: 'warning',
      message: `Pérdida diaria al ${usedPct.toFixed(0)}% del límite. Aproximándose al máximo permitido.`,
      value: snapshot.dailyLossUsedCents,
      limit: snapshot.dailyLossLimitCents,
    };
  }
  return {
    rule: 'max_daily_loss',
    ruleSource: 'prop_firm',
    status: 'ok',
    message: `Pérdida diaria al ${usedPct.toFixed(0)}% del límite.`,
    value: snapshot.dailyLossUsedCents,
    limit: snapshot.dailyLossLimitCents,
  };
}

function checkMaxDrawdown(snapshot) {
  const usedPct = snapshot.drawdownUsedPct;
  if (snapshot.drawdownUsedCents >= snapshot.drawdownLimitCents && snapshot.drawdownLimitCents > 0) {
    return {
      rule: 'max_overall_loss',
      ruleSource: 'prop_firm',
      status: 'violation',
      message: 'Se alcanzó o superó el drawdown máximo permitido.',
      value: snapshot.drawdownUsedCents,
      limit: snapshot.drawdownLimitCents,
    };
  }
  if (usedPct >= 75) {
    return {
      rule: 'max_overall_loss',
      ruleSource: 'prop_firm',
      status: 'warning',
      message: `Drawdown al ${usedPct.toFixed(0)}% del máximo permitido.`,
      value: snapshot.drawdownUsedCents,
      limit: snapshot.drawdownLimitCents,
    };
  }
  return {
    rule: 'max_overall_loss',
    ruleSource: 'prop_firm',
    status: 'ok',
    message: `Drawdown al ${usedPct.toFixed(0)}% del máximo permitido.`,
    value: snapshot.drawdownUsedCents,
    limit: snapshot.drawdownLimitCents,
  };
}

function checkMinTradingDays(snapshot, rules) {
  if (!rules.minTradingDays) return null;
  const status = snapshot.tradingDaysCount >= rules.minTradingDays ? 'ok' : 'warning';
  return {
    rule: 'min_trading_days',
    ruleSource: 'prop_firm',
    status,
    message:
      status === 'ok'
        ? `Cumpliste el mínimo de ${rules.minTradingDays} días de trading.`
        : `Llevas ${snapshot.tradingDaysCount} de ${rules.minTradingDays} días mínimos requeridos.`,
    value: snapshot.tradingDaysCount,
    limit: rules.minTradingDays,
  };
}

// % que el mejor día representa del total de ganancias. Evita división por cero.
function checkConsistency(snapshot, rules, trades) {
  if (!rules.consistencyRule) return null;
  const byDay = new Map();
  for (const t of trades) {
    byDay.set(t.date, (byDay.get(t.date) ?? 0) + t.pnlCents);
  }
  const values = [...byDay.values()];
  const totalProfit = values.filter((v) => v > 0).reduce((a, b) => a + b, 0);
  const bestDay = values.length ? Math.max(0, ...values) : 0;
  if (totalProfit <= 0) return null;

  const bestDayPct = pctOf(bestDay, totalProfit);
  const limit = rules.consistencyRule.maxBestDayContributionPct;
  const status = bestDayPct > limit ? 'violation' : bestDayPct > limit * 0.8 ? 'warning' : 'ok';
  return {
    rule: 'consistency',
    ruleSource: 'prop_firm',
    status,
    message: `Tu mejor día representa el ${bestDayPct.toFixed(0)}% de tus ganancias totales (límite: ${limit}%).`,
    value: bestDayPct,
    limit,
  };
}

function checkProfitTarget(snapshot) {
  if (snapshot.profitTargetProgressPct >= 100) {
    return {
      rule: 'profit_target',
      ruleSource: 'prop_firm',
      status: 'ok',
      message: '🎯 Profit target alcanzado. Confirma manualmente cuando la Prop Firm lo apruebe.',
      value: snapshot.profitTargetProgressPct,
      limit: 100,
    };
  }
  return null;
}

const CHECKERS = [
  checkMaxTradesPerDay,
  checkMaxDailyLoss,
  checkMaxDrawdown,
  checkMinTradingDays,
  checkConsistency,
  checkProfitTarget,
];

export function evaluatePropRules(snapshot, rules, trades) {
  return CHECKERS.map((check) => check(snapshot, rules, trades)).filter((r) => r !== null);
}

export function hasViolation(results) {
  return results.some((r) => r.status === 'violation');
}

// ---- js/domain/personalRuleEngine.js ----
function personalCheckMaxTradesPerDay(snapshot, rules) {
  if (!rules.maxTradesPerDay) return null;
  const { tradesToday } = snapshot;
  const limit = rules.maxTradesPerDay;
  const status = tradesToday > limit ? 'violation' : tradesToday === limit ? 'warning' : 'ok';
  return {
    rule: 'personal_max_trades_per_day',
    ruleSource: 'personal',
    status,
    message:
      status === 'ok'
        ? `${limit - tradesToday} trade(s) restante(s) según tu límite personal.`
        : 'Límite personal de trades diarios alcanzado.',
    value: tradesToday,
    limit,
  };
}

function checkMaxConsecutiveLosses(snapshot, rules) {
  if (!rules.maxConsecutiveLosses) return null;
  const status = snapshot.consecutiveLosses >= rules.maxConsecutiveLosses ? 'violation' : 'ok';
  return {
    rule: 'personal_max_consecutive_losses',
    ruleSource: 'personal',
    status,
    message:
      status === 'violation'
        ? `Alcanzaste tu límite personal de ${rules.maxConsecutiveLosses} pérdidas consecutivas. Se recomienda detenerse.`
        : `${snapshot.consecutiveLosses} pérdida(s) consecutiva(s).`,
    value: snapshot.consecutiveLosses,
    limit: rules.maxConsecutiveLosses,
  };
}

function personalCheckMaxDailyLoss(snapshot, rules) {
  if (!rules.maxDailyLossCents) return null;
  const used = Math.max(0, -snapshot.dailyPnlCents);
  const status = used >= rules.maxDailyLossCents ? 'violation' : used >= rules.maxDailyLossCents * 0.75 ? 'warning' : 'ok';
  return {
    rule: 'personal_max_daily_loss',
    ruleSource: 'personal',
    status,
    message: status === 'violation' ? 'Superaste tu stop diario personal.' : 'Dentro de tu stop diario personal.',
    value: used,
    limit: rules.maxDailyLossCents,
  };
}

function checkStopAfterDailyTarget(snapshot, rules) {
  if (!rules.stopAfterDailyTargetCents) return null;
  const status = snapshot.dailyPnlCents >= rules.stopAfterDailyTargetCents ? 'warning' : 'ok';
  return {
    rule: 'personal_daily_target',
    ruleSource: 'personal',
    status,
    message: status === 'warning' ? 'Alcanzaste tu meta diaria personal. Considera detenerte por hoy.' : 'Meta diaria personal aún no alcanzada.',
    value: snapshot.dailyPnlCents,
    limit: rules.stopAfterDailyTargetCents,
  };
}

const PERSONAL_CHECKERS = [personalCheckMaxTradesPerDay, checkMaxConsecutiveLosses, personalCheckMaxDailyLoss, checkStopAfterDailyTarget];

export function evaluatePersonalRules(snapshot, rules) {
  return PERSONAL_CHECKERS.map((c) => c(snapshot, rules)).filter((r) => r !== null);
}

// ---- js/domain/canITrade.js ----


export function canITrade(snapshot, propRules, personalRules, trades) {
  const propResults = evaluatePropRules(snapshot, propRules, trades);
  const personalResults = evaluatePersonalRules(snapshot, personalRules);
  const all = [...propResults, ...personalResults];

  const violation = all.find((r) => r.status === 'violation' && r.rule !== 'profit_target');
  const warning = all.find((r) => r.status === 'warning');

  let verdict = 'safe';
  let headline = 'SAFE TO TRADE';
  if (violation) {
    verdict = 'stop';
    headline = 'STOP TRADING';
  } else if (warning) {
    verdict = 'warning';
    headline = 'WARNING';
  }

  const reasons = all
    .filter((r) => r.status !== 'ok')
    .map((r) => `${r.ruleSource === 'prop_firm' ? '[Prop Firm] ' : '[Personal] '}${r.message}`);

  const maxTrades = propRules.maxTradesPerDay ?? null;

  return {
    verdict,
    headline,
    tradesRemainingToday: maxTrades !== null ? Math.max(0, maxTrades - snapshot.tradesToday) : null,
    dailyLossRemainingCents: snapshot.dailyLossRemainingCents,
    drawdownRemainingCents: snapshot.drawdownRemainingCents,
    dailyPnlCents: snapshot.dailyPnlCents,
    riskScore: snapshot.riskScore,
    reasons,
  };
}

// ---- js/domain/analytics.js ----

export function calculateStatistics(trades) {
  const total = trades.length;
  const wins = trades.filter((t) => t.result === 'win');
  const losses = trades.filter((t) => t.result === 'loss');
  const breakEvens = trades.filter((t) => t.result === 'break_even');
  const decisive = wins.length + losses.length;
  const winRatePct = decisive ? (wins.length / decisive) * 100 : 0;

  const avgWinCents = wins.length ? Math.round(addCents(...wins.map((t) => t.pnlCents)) / wins.length) : 0;
  const avgLossCents = losses.length ? Math.round(addCents(...losses.map((t) => t.pnlCents)) / losses.length) : 0;

  const grossProfit = addCents(...wins.map((t) => t.pnlCents));
  const grossLoss = Math.abs(addCents(...losses.map((t) => t.pnlCents)));
  const profitFactor = grossLoss === 0 ? (grossProfit > 0 ? Infinity : 0) : grossProfit / grossLoss;

  const rrValues = trades.filter((t) => t.riskRewardRatio).map((t) => t.riskRewardRatio);
  const avgRR = rrValues.length ? rrValues.reduce((a, b) => a + b, 0) / rrValues.length : 0;

  const realizedPnlCents = addCents(...trades.map((t) => t.pnlCents));

  const largestWinCents = wins.length ? Math.max(...wins.map((t) => t.pnlCents)) : 0;
  const largestLossCents = losses.length ? Math.min(...losses.map((t) => t.pnlCents)) : 0;

  const sorted = [...trades].sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  let maxWinStreak = 0, maxLossStreak = 0, curWin = 0, curLoss = 0;
  for (const t of sorted) {
    if (t.result === 'win') { curWin++; curLoss = 0; }
    else if (t.result === 'loss') { curLoss++; curWin = 0; }
    else { curWin = 0; curLoss = 0; }
    maxWinStreak = Math.max(maxWinStreak, curWin);
    maxLossStreak = Math.max(maxLossStreak, curLoss);
  }

  const byDay = groupPnlBy(trades, (t) => t.date);
  const tradingDays = Object.keys(byDay).length;
  const avgTradesPerDay = tradingDays ? total / tradingDays : 0;
  const bestDay = topEntry(byDay, true);
  const worstDay = topEntry(byDay, false);

  const byAsset = groupPnlBy(trades, (t) => t.symbol);
  const bestAsset = topEntry(byAsset, true);
  const worstAsset = topEntry(byAsset, false);

  const bySession = groupPnlBy(trades, (t) => t.session || 'sin sesión');
  const bestSession = topEntry(bySession, true);
  const worstSession = topEntry(bySession, false);

  const buyTrades = trades.filter((t) => t.direction === 'buy');
  const sellTrades = trades.filter((t) => t.direction === 'sell');

  return {
    totalTrades: total,
    wins: wins.length,
    losses: losses.length,
    breakEvens: breakEvens.length,
    winRatePct,
    avgWinCents,
    avgLossCents,
    avgRR,
    realizedPnlCents,
    profitFactor,
    largestWinCents,
    largestLossCents,
    maxWinStreak,
    maxLossStreak,
    avgTradesPerDay,
    bestDay,
    worstDay,
    bestAsset,
    worstAsset,
    bestSession,
    worstSession,
    buyStats: sideStats(buyTrades),
    sellStats: sideStats(sellTrades),
    pnlByAsset: Object.entries(byAsset).sort((a, b) => b[1] - a[1]),
  };
}

function sideStats(trades) {
  const decisive = trades.filter((t) => t.result !== 'break_even');
  const wins = trades.filter((t) => t.result === 'win').length;
  return {
    count: trades.length,
    winRatePct: decisive.length ? (wins / decisive.length) * 100 : 0,
    pnlCents: addCents(...trades.map((t) => t.pnlCents)),
  };
}

function groupPnlBy(trades, keyFn) {
  const map = {};
  for (const t of trades) {
    const k = keyFn(t);
    map[k] = (map[k] || 0) + t.pnlCents;
  }
  return map;
}

function topEntry(map, best) {
  const entries = Object.entries(map);
  if (!entries.length) return null;
  entries.sort((a, b) => (best ? b[1] - a[1] : a[1] - b[1]));
  return { key: entries[0][0], pnlCents: entries[0][1] };
}

// Curva de equity: puntos (fecha, balance acumulado) para graficar.
export function buildEquityCurve(account, trades) {
  const sorted = [...trades].sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  let running = account.startingBalanceCents;
  const points = [{ date: account.challengeStartDate, balanceCents: running }];
  for (const t of sorted) {
    running += t.pnlCents;
    points.push({ date: t.date, balanceCents: running });
  }
  return points;
}

// Consistency: contribución del mejor día al total de ganancias.
export function calculateConsistency(trades) {
  const byDay = groupPnlBy(trades, (t) => t.date);
  const values = Object.values(byDay);
  const totalProfit = values.filter((v) => v > 0).reduce((a, b) => a + b, 0);
  const bestDay = values.length ? Math.max(0, ...values) : 0;
  return {
    totalProfitCents: totalProfit,
    bestDayCents: bestDay,
    bestDayContributionPct: pctOf(bestDay, totalProfit),
  };
}

// ---- js/domain/habits.js ----
// Observaciones puramente descriptivas sobre datos históricos. Nunca consejos ni predicciones.

export function detectHabits(trades) {
  const habits = [];
  if (trades.length < 5) return habits;

  // Win rate después del 3er trade del día
  const byDay = {};
  for (const t of trades) {
    (byDay[t.date] ||= []).push(t);
  }
  let afterThirdDecisive = 0, afterThirdWins = 0;
  for (const dayTrades of Object.values(byDay)) {
    const sorted = [...dayTrades].sort((a, b) => a.time.localeCompare(b.time));
    sorted.slice(3).forEach((t) => {
      if (t.result !== 'break_even') {
        afterThirdDecisive++;
        if (t.result === 'win') afterThirdWins++;
      }
    });
  }
  if (afterThirdDecisive >= 5) {
    const rate = (afterThirdWins / afterThirdDecisive) * 100;
    habits.push(`Tu win rate después del tercer trade del día es de ${rate.toFixed(0)}% (con ${afterThirdDecisive} operaciones registradas).`);
  }

  // Concentración de ganancias por símbolo
  const bySymbol = {};
  for (const t of trades) bySymbol[t.symbol] = (bySymbol[t.symbol] || 0) + t.pnlCents;
  const totalProfit = Object.values(bySymbol).filter((v) => v > 0).reduce((a, b) => a + b, 0);
  const topSymbol = Object.entries(bySymbol).sort((a, b) => b[1] - a[1])[0];
  if (topSymbol && totalProfit > 0 && topSymbol[1] > 0) {
    const pct = (topSymbol[1] / totalProfit) * 100;
    if (pct >= 40) {
      habits.push(`${topSymbol[0]} representa el ${pct.toFixed(0)}% de tus ganancias totales registradas.`);
    }
  }

  // Comparación de sesiones
  const bySession = {};
  for (const t of trades) {
    if (!t.session) continue;
    (bySession[t.session] ||= []).push(t);
  }
  const sessionEntries = Object.entries(bySession).filter(([, arr]) => arr.length >= 3);
  if (sessionEntries.length >= 2) {
    const withWinRate = sessionEntries.map(([session, arr]) => {
      const decisive = arr.filter((t) => t.result !== 'break_even');
      const wins = arr.filter((t) => t.result === 'win').length;
      return { session, winRate: decisive.length ? (wins / decisive.length) * 100 : 0 };
    });
    withWinRate.sort((a, b) => b.winRate - a.winRate);
    const best = withWinRate[0];
    const worst = withWinRate[withWinRate.length - 1];
    if (best.winRate - worst.winRate >= 10) {
      habits.push(`Tus operaciones en sesión ${best.session} tienen un win rate más alto (${best.winRate.toFixed(0)}%) que en sesión ${worst.session} (${worst.winRate.toFixed(0)}%).`);
    }
  }

  // Trades marcados con emoción específica
  const byEmotion = {};
  for (const t of trades) {
    if (!t.emotionBefore) continue;
    (byEmotion[t.emotionBefore] ||= []).push(t);
  }
  for (const [emotion, arr] of Object.entries(byEmotion)) {
    if (arr.length < 3) continue;
    const decisive = arr.filter((t) => t.result !== 'break_even');
    const wins = arr.filter((t) => t.result === 'win').length;
    const rate = decisive.length ? (wins / decisive.length) * 100 : 0;
    if (['fomo', 'revenge', 'anxious'].includes(emotion) && rate <= 40) {
      habits.push(`Tus trades marcados como "${emotion}" tienen un win rate de ${rate.toFixed(0)}% (${arr.length} operaciones).`);
    }
  }

  // Segundo trade consecutivo después de una pérdida
  const sortedAll = [...trades].sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  let afterLossDecisive = 0, afterLossWins = 0;
  for (let i = 1; i < sortedAll.length; i++) {
    if (sortedAll[i - 1].result === 'loss' && sortedAll[i].result !== 'break_even') {
      afterLossDecisive++;
      if (sortedAll[i].result === 'win') afterLossWins++;
    }
  }
  if (afterLossDecisive >= 5) {
    const rate = (afterLossWins / afterLossDecisive) * 100;
    if (rate <= 40) {
      habits.push(`Tu operación inmediatamente después de una pérdida tiene un win rate histórico de ${rate.toFixed(0)}% (${afterLossDecisive} casos).`);
    }
  }

  return habits;
}

// ---- js/data/storage.js ----
// Persistencia local con localStorage. Toda la app accede a los datos SOLO a través de
// estas funciones — así, migrar a IndexedDB o a un backend (Supabase/Firebase) en el futuro
// significa reescribir este archivo únicamente, sin tocar UI ni servicios de dominio.

const SCHEMA_VERSION = 1;
const KEY = 'prop-tracker:v' + SCHEMA_VERSION;

function loadAll() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return emptyState();
    const parsed = JSON.parse(raw);
    return { ...emptyState(), ...parsed };
  } catch (e) {
    console.error('Error leyendo almacenamiento local, se reinicia el estado', e);
    return emptyState();
  }
}

function emptyState() {
  return {
    accounts: [],
    propRules: {}, // accountId -> PropRules
    personalRules: {}, // accountId -> PersonalRules
    trades: [], // Trade[]
    dailyPlans: [], // DailyTradingPlan[]
    dailyJournals: [], // DailyJournal[]
    ruleEvents: [], // RuleEvent[]
    activeAccountId: null,
  };
}

let state = loadAll();

function persist() {
  localStorage.setItem(KEY, JSON.stringify(state));
}

function uid() {
  return 'id_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 9);
}

function nowISO() {
  return new Date().toISOString();
}

export const db = {
  // ---- Accounts ----
  getAccounts() {
    return state.accounts;
  },
  getAccount(id) {
    return state.accounts.find((a) => a.id === id) || null;
  },
  createAccount(data) {
    const account = {
      id: uid(),
      status: 'active',
      createdAt: nowISO(),
      updatedAt: nowISO(),
      ...data,
    };
    state.accounts.push(account);
    if (!state.activeAccountId) state.activeAccountId = account.id;
    persist();
    return account;
  },
  updateAccount(id, patch) {
    const idx = state.accounts.findIndex((a) => a.id === id);
    if (idx === -1) return null;
    state.accounts[idx] = { ...state.accounts[idx], ...patch, updatedAt: nowISO() };
    persist();
    return state.accounts[idx];
  },
  deleteAccount(id) {
    state.accounts = state.accounts.filter((a) => a.id !== id);
    state.trades = state.trades.filter((t) => t.accountId !== id);
    delete state.propRules[id];
    delete state.personalRules[id];
    state.dailyPlans = state.dailyPlans.filter((p) => p.accountId !== id);
    state.dailyJournals = state.dailyJournals.filter((j) => j.accountId !== id);
    state.ruleEvents = state.ruleEvents.filter((e) => e.accountId !== id);
    if (state.activeAccountId === id) {
      state.activeAccountId = state.accounts[0]?.id ?? null;
    }
    persist();
  },
  getActiveAccountId() {
    return state.activeAccountId;
  },
  setActiveAccountId(id) {
    state.activeAccountId = id;
    persist();
  },

  // ---- Prop rules ----
  getPropRules(accountId) {
    return state.propRules[accountId] || null;
  },
  setPropRules(accountId, rules) {
    state.propRules[accountId] = { accountId, ...rules };
    persist();
    return state.propRules[accountId];
  },

  // ---- Personal rules ----
  getPersonalRules(accountId) {
    return state.personalRules[accountId] || { accountId };
  },
  setPersonalRules(accountId, rules) {
    state.personalRules[accountId] = { accountId, ...rules };
    persist();
    return state.personalRules[accountId];
  },

  // ---- Trades ----
  getTrades(accountId) {
    return state.trades.filter((t) => t.accountId === accountId);
  },
  getTrade(id) {
    return state.trades.find((t) => t.id === id) || null;
  },
  createTrade(data) {
    const trade = { id: uid(), createdAt: nowISO(), updatedAt: nowISO(), ...data };
    state.trades.push(trade);
    persist();
    return trade;
  },
  updateTrade(id, patch) {
    const idx = state.trades.findIndex((t) => t.id === id);
    if (idx === -1) return null;
    state.trades[idx] = { ...state.trades[idx], ...patch, updatedAt: nowISO() };
    persist();
    return state.trades[idx];
  },
  deleteTrade(id) {
    state.trades = state.trades.filter((t) => t.id !== id);
    persist();
  },

  // ---- Daily plans ----
  getDailyPlan(accountId, date) {
    return state.dailyPlans.find((p) => p.accountId === accountId && p.date === date) || null;
  },
  upsertDailyPlan(data) {
    const idx = state.dailyPlans.findIndex((p) => p.accountId === data.accountId && p.date === data.date);
    if (idx === -1) {
      const plan = { id: uid(), ...data };
      state.dailyPlans.push(plan);
      persist();
      return plan;
    }
    state.dailyPlans[idx] = { ...state.dailyPlans[idx], ...data };
    persist();
    return state.dailyPlans[idx];
  },

  // ---- Daily journals ----
  getDailyJournal(accountId, date) {
    return state.dailyJournals.find((j) => j.accountId === accountId && j.date === date) || null;
  },
  upsertDailyJournal(data) {
    const idx = state.dailyJournals.findIndex((j) => j.accountId === data.accountId && j.date === data.date);
    if (idx === -1) {
      const journal = { id: uid(), ...data };
      state.dailyJournals.push(journal);
      persist();
      return journal;
    }
    state.dailyJournals[idx] = { ...state.dailyJournals[idx], ...data };
    persist();
    return state.dailyJournals[idx];
  },

  // ---- Rule events ----
  getRuleEvents(accountId) {
    return state.ruleEvents.filter((e) => e.accountId === accountId).sort((a, b) => b.timestamp.localeCompare(a.timestamp));
  },
  addRuleEvent(data) {
    const event = { id: uid(), timestamp: nowISO(), ...data };
    state.ruleEvents.push(event);
    persist();
    return event;
  },

  // ---- Backup / export ----
  exportBackup() {
    return JSON.stringify(state, null, 2);
  },
  importBackup(json) {
    const parsed = JSON.parse(json);
    state = { ...emptyState(), ...parsed };
    persist();
  },
  exportTradesCSV(accountId) {
    const trades = db.getTrades(accountId);
    const headers = ['date','time','symbol','direction','entryPrice','exitPrice','lotSize','result','pnlCents','setup','timeframe','session','tradeType','notes'];
    const rows = trades.map((t) => headers.map((h) => JSON.stringify(t[h] ?? '')).join(','));
    return [headers.join(','), ...rows].join('\n');
  },
};

// ---- js/utils/dateUtils.js ----
export function todayISO() {
  const d = new Date();
  return toISODate(d);
}

export function nowTimeHM() {
  const d = new Date();
  return d.toTimeString().slice(0, 5);
}

export function toISODate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

export function formatDateHuman(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-').map(Number);
  const date = new Date(y, m - 1, d);
  return date.toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' });
}

export function formatDateShort(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-').map(Number);
  const date = new Date(y, m - 1, d);
  return date.toLocaleDateString('es-ES', { day: '2-digit', month: 'short' });
}

const DOW = ['DOM', 'LUN', 'MAR', 'MIÉ', 'JUE', 'VIE', 'SÁB'];

// Devuelve una matriz de semanas para el mes/año dado, con celdas vacías (null) para completar.
export function getMonthMatrix(year, month) {
  const firstDay = new Date(year, month, 1);
  const startOffset = firstDay.getDay(); // 0 = domingo
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  const cells = [];
  for (let i = 0; i < startOffset; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) {
    const iso = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    cells.push(iso);
  }
  while (cells.length % 7 !== 0) cells.push(null);

  const weeks = [];
  for (let i = 0; i < cells.length; i += 7) weeks.push(cells.slice(i, i + 7));
  return weeks;
}

export function dowLabels() {
  return DOW;
}

export function monthLabel(year, month) {
  return new Date(year, month, 1).toLocaleDateString('es-ES', { month: 'long', year: 'numeric' });
}

const STATUS_LABEL = {
  safe: 'SAFE',
  warning: 'WARNING',
  danger: 'DANGER',
  rule_violated: 'RULE VIOLATED',
};

const RISK_LABEL = { low: 'LOW', moderate: 'MODERATE', high: 'HIGH', critical: 'CRITICAL' };

export function renderHome(root, ctx, activeAccountId) {
  const account = ctx.db.getAccount(activeAccountId);
  if (!account) {
    root.innerHTML = `<div class="screen"><div class="empty-state"><h3>No hay cuenta activa</h3></div></div>`;
    return;
  }
  const rules = ctx.db.getPropRules(activeAccountId);
  const trades = ctx.db.getTrades(activeAccountId);
  const accounts = ctx.db.getAccounts();

  let snapshot = calculateAccountSnapshot(account, rules, trades, { today: todayISO() });
  const ruleResults = evaluatePropRules(snapshot, rules, trades);
  if (hasViolation(ruleResults)) {
    snapshot = calculateAccountSnapshot(account, rules, trades, { today: todayISO(), hasActiveViolation: true });
  }

  const deltaClass = snapshot.totalPnlCents > 0 ? 'pos' : snapshot.totalPnlCents < 0 ? 'neg' : 'flat';
  const progressClass = snapshot.status === 'danger' || snapshot.status === 'rule_violated' ? 'danger' : snapshot.status === 'warning' ? 'warning' : 'accent';
  const dailyLossPct = clampPct((snapshot.dailyLossUsedCents / (snapshot.dailyLossLimitCents || 1)) * 100);
  const dailyLossClass = dailyLossPct >= 90 ? 'danger' : dailyLossPct >= 50 ? 'warning' : 'safe';
  const drawdownPct = clampPct((snapshot.drawdownUsedCents / (snapshot.drawdownLimitCents || 1)) * 100);
  const drawdownClass = drawdownPct >= 90 ? 'danger' : drawdownPct >= 50 ? 'warning' : 'safe';

  root.innerHTML = `
    <div class="screen">
      ${accounts.length > 1 ? accountSwitcherHtml(account, accounts) : ''}

      <div class="screen-header">
        <div>
          <div class="screen-subtitle">${escapeHtml(account.propFirm)} · ${escapeHtml(account.accountName)}</div>
        </div>
        <span class="status-badge ${snapshot.status}"><span class="status-dot"></span>${STATUS_LABEL[snapshot.status]}</span>
      </div>

      <div class="balance-hero">
        <div class="label">Current Balance</div>
        <div class="amount num">${formatMoney(snapshot.currentBalanceCents, account.currency)}</div>
        <div class="delta ${deltaClass} num">${formatCents(snapshot.totalPnlCents, account.currency)} · ${formatPct(snapshot.returnPct)}</div>
      </div>

      <div class="progress-block">
        <div class="progress-row">
          <span class="title">PROFIT TARGET</span>
          <span class="value num">${formatCents(snapshot.totalPnlCents, account.currency)} / ${formatMoney(snapshot.profitTargetCents, account.currency)}</span>
        </div>
        <div class="progress-track"><div class="progress-fill ${progressClass}" style="width:${clampPct(snapshot.profitTargetProgressPct)}%"></div></div>
        <div class="field-hint">${snapshot.profitTargetProgressPct.toFixed(1)}% completado</div>
      </div>

      <div class="metric-grid">
        <div class="metric-cell">
          <div class="label">DAILY P/L</div>
          <div class="value num" style="color:${snapshot.dailyPnlCents >= 0 ? 'var(--safe)' : 'var(--danger)'}">${formatCents(snapshot.dailyPnlCents, account.currency)}</div>
        </div>
        <div class="metric-cell">
          <div class="label">TRADES TODAY</div>
          <div class="value num">${snapshot.tradesToday}${rules.maxTradesPerDay ? ' / ' + rules.maxTradesPerDay : ''}</div>
        </div>
        <div class="metric-cell">
          <div class="label">DAILY LOSS AVAILABLE</div>
          <div class="value num">${formatMoney(snapshot.dailyLossRemainingCents, account.currency)}</div>
        </div>
        <div class="metric-cell">
          <div class="label">MAX DRAWDOWN AVAILABLE</div>
          <div class="value num">${formatMoney(snapshot.drawdownRemainingCents, account.currency)}</div>
        </div>
        <div class="metric-cell">
          <div class="label">WIN RATE</div>
          <div class="value num">${snapshot.winRatePct.toFixed(0)}%</div>
        </div>
        <div class="metric-cell">
          <div class="label">TRADING DAYS</div>
          <div class="value num">${snapshot.tradingDaysCount}${rules.minTradingDays ? ' / ' + rules.minTradingDays : ''}</div>
        </div>
      </div>

      <div class="card">
        <div class="progress-row mt-0">
          <span class="title">DAILY LOSS USED</span>
          <span class="value num">${formatMoney(snapshot.dailyLossUsedCents, account.currency)} / ${formatMoney(snapshot.dailyLossLimitCents, account.currency)}</span>
        </div>
        <div class="progress-track"><div class="progress-fill ${dailyLossClass}" style="width:${dailyLossPct}%"></div></div>
      </div>

      <div class="card">
        <div class="progress-row mt-0">
          <span class="title">MAX DRAWDOWN USED</span>
          <span class="value num">${formatMoney(snapshot.drawdownUsedCents, account.currency)} / ${formatMoney(snapshot.drawdownLimitCents, account.currency)}</span>
        </div>
        <div class="progress-track"><div class="progress-fill ${drawdownClass}" style="width:${drawdownPct}%"></div></div>
      </div>

      <div class="card">
        <div class="progress-row mt-0">
          <span class="title">ACCOUNT RISK</span>
          <span class="status-badge ${riskBadgeClass(snapshot.riskScore)}">${RISK_LABEL[snapshot.riskScore]}</span>
        </div>
      </div>

      <button class="btn btn-secondary" id="can-i-trade-btn" style="margin-bottom:10px;">${icons.shield} CAN I TRADE?</button>

      <div class="btn-row" style="margin-bottom:10px;">
        <button class="btn btn-ghost" id="progress-btn">Progress</button>
        <button class="btn btn-ghost" id="daily-plan-btn">Daily Plan</button>
      </div>
      <div class="btn-row" style="margin-bottom:14px;">

      </div>
    </div>

  root.querySelector('#can-i-trade-btn').addEventListener('click', () => {

    renderCanITradeSheet(ctx, result, account.currency);
  });
  root.querySelector('#progress-btn').addEventListener('click', () => ctx.navigate('progress'));
  root.querySelector('#daily-plan-btn').addEventListener('click', () => ctx.navigate('daily-plan'));
  root.querySelector('#rule-events-btn').addEventListener('click', () => ctx.navigate('rule-events'));
  root.querySelector('#settings-btn').addEventListener('click', () => ctx.navigate('account-settings'));

  const switcherBtn = root.querySelector('#switch-account-btn');
  if (switcherBtn) switcherBtn.addEventListener('click', () => ctx.navigate('accounts'));
}

function accountSwitcherHtml(account, accounts) {
  return `
    <button class="account-switcher" id="switch-account-btn" style="width:100%;border:1px solid var(--border-hairline);cursor:pointer;">
      <div>
        <div class="name">${escapeHtml(account.accountName)}</div>
        <div class="firm">${escapeHtml(account.propFirm)} · ${accounts.length} cuentas</div>

function riskBadgeClass(risk) {
  if (risk === 'low') return 'safe';
  if (risk === 'moderate') return 'warning';
  return 'danger';
}

function setupSegmented(root, selector, hiddenName) {
  const el = root.querySelector(selector);
  if (!el) return;
  const hidden = el.parentElement.querySelector(`input[name="${hiddenName}"]`);
  el.querySelectorAll('button').forEach((btn) => {
    btn.addEventListener('click', () => {
      el.querySelectorAll('button').forEach((b) => b.classList.remove('active', 'buy', 'sell'));
      const cls = btn.dataset.val === 'buy' ? 'buy' : btn.dataset.val === 'sell' ? 'sell' : '';
      btn.classList.add('active');
      if (cls) btn.classList.add(cls);
      hidden.value = btn.dataset.val;
    });
  });
}

function setupChips(root, selector, hiddenName) {
  const el = root.querySelector(selector);
  if (!el) return;
  const hidden = el.parentElement.querySelector(`input[name="${hiddenName}"]`);
  el.querySelectorAll('button').forEach((btn) => {
    btn.addEventListener('click', () => {
      const already = btn.classList.contains('active');
      el.querySelectorAll('button').forEach((b) => b.classList.remove('active'));
      if (!already) {
        btn.classList.add('active');
        hidden.value = btn.dataset.val;
      } else {
        hidden.value = '';
      }
    });
  });
}

function readFileAsDataUrl(file, cb) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => cb(reader.result);
  reader.readAsDataURL(file);
}

// Registra en Rule Events el estado actual de las reglas tras guardar un trade.
function logRuleEventsIfAny(ctx, accountId) {
  const account = ctx.db.getAccount(accountId);
  const rules = ctx.db.getPropRules(accountId);
  const personalRules = ctx.db.getPersonalRules(accountId);
  const trades = ctx.db.getTrades(accountId);
  const snapshot = calculateAccountSnapshot(account, rules, trades, { today: trades[trades.length - 1]?.date || account.challengeStartDate });

  const propResults = evaluatePropRules(snapshot, rules, trades).filter((r) => r.status !== 'ok');
  const personalResults = evaluatePersonalRules(snapshot, personalRules).filter((r) => r.status !== 'ok');

  [...propResults, ...personalResults].forEach((r) => {
    ctx.db.addRuleEvent({
      accountId,
      ruleSource: r.ruleSource,
      rule: r.rule,
      severity: r.status === 'violation' ? 'violation' : 'warning',
      value: r.value,
      limit: r.limit,
      message: r.message,
    });
  });
}

let activeFilter = { type: null, value: null };

export function renderJournal(root, ctx, accountId) {
  const account = ctx.db.getAccount(accountId);
  let trades = ctx.db.getTrades(accountId).sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time));

  const filters = buildFilterChips(trades);

  if (activeFilter.type) {
    trades = trades.filter((t) => matchesFilter(t, activeFilter));
  }

  root.innerHTML = `
    <div class="screen">
      <div class="screen-header">
        <div class="screen-title">Journal</div>
        <span class="screen-subtitle">${trades.length} trade${trades.length === 1 ? '' : 's'}</span>
      </div>

      <div class="filter-scroll" id="filter-scroll">
        <button class="chip ${!activeFilter.type ? 'active' : ''}" data-type="" data-value="">Todos</button>
        ${filters.map((f) => `<button class="chip ${activeFilter.type === f.type && activeFilter.value === f.value ? 'active' : ''}" data-type="${f.type}" data-value="${f.value}">${f.label}</button>`).join('')}
      </div>

      <div class="card" style="padding:4px 12px;">
        ${trades.length === 0 ? emptyStateHtml() : trades.map((t) => tradeRowHtml(t, account?.currency)).join('')}
      </div>
    </div>
  `;

  root.querySelectorAll('#filter-scroll button').forEach((btn) => {
    btn.addEventListener('click', () => {
      activeFilter = btn.dataset.type ? { type: btn.dataset.type, value: btn.dataset.value } : { type: null, value: null };
      ctx.rerender();
    });
  });

  root.querySelectorAll('[data-trade-id]').forEach((row) => {
    row.addEventListener('click', () => ctx.navigate('trade/' + row.dataset.tradeId));
  });
}

function buildFilterChips(trades) {
  const symbols = [...new Set(trades.map((t) => t.symbol))].slice(0, 6);
  const chips = symbols.map((s) => ({ type: 'symbol', value: s, label: s }));
  chips.push({ type: 'result', value: 'win', label: 'Wins' });
  chips.push({ type: 'result', value: 'loss', label: 'Losses' });
  chips.push({ type: 'direction', value: 'buy', label: 'Buy' });
  chips.push({ type: 'direction', value: 'sell', label: 'Sell' });
  return chips;
}

function matchesFilter(trade, filter) {
  if (filter.type === 'symbol') return trade.symbol === filter.value;
  if (filter.type === 'result') return trade.result === filter.value;
  if (filter.type === 'direction') return trade.direction === filter.value;
  return true;
}

function tradeRowHtml(t, currency) {
  return `
    <div class="trade-row" data-trade-id="${t.id}" style="cursor:pointer;">
      <div class="left">
        <div class="symbol"><span class="dir-tag ${t.direction}">${t.direction === 'buy' ? 'BUY' : 'SELL'}</span>${t.symbol}</div>
        <div class="meta">${formatDateShort(t.date)} · ${t.time}${t.setup ? ' · ' + escapeHtml(t.setup) : ''}</div>
      </div>
      <div class="pnl" style="color:${t.pnlCents >= 0 ? 'var(--safe)' : 'var(--danger)'}">${formatCents(t.pnlCents, currency)}</div>
    </div>
  `;
}

function emptyStateHtml() {
  return `
    <div class="empty-state">
      <div class="icon">📓</div>
      <h3>Sin trades todavía</h3>
      <p>Registra tu primera operación desde el botón + en la barra inferior.</p>
    </div>
  `;
}

let viewYear = null;
let viewMonth = null;

export function renderCalendar(root, ctx, accountId) {
  const account = ctx.db.getAccount(accountId);
  const trades = ctx.db.getTrades(accountId);
  const today = new Date();
  if (viewYear === null) { viewYear = today.getFullYear(); viewMonth = today.getMonth(); }

  const byDate = groupByDate(trades);
  const weeks = getMonthMatrix(viewYear, viewMonth);
  const todayIso = todayISO();

  root.innerHTML = `
    <div class="screen">
      <div class="screen-header">
        <div class="screen-title">Calendar</div>
      </div>

      <div class="btn-row" style="align-items:center;margin-bottom:14px;">
        <button class="btn btn-ghost" id="prev-month" style="flex:0 0 44px;">‹</button>
        <div class="text-center" style="flex:1;font-weight:600;text-transform:capitalize;">${monthLabel(viewYear, viewMonth)}</div>
        <button class="btn btn-ghost" id="next-month" style="flex:0 0 44px;">›</button>
      </div>

      <div class="calendar-grid">
        ${dowLabels().map((d) => `<div class="calendar-dow">${d}</div>`).join('')}
        ${weeks.flat().map((iso) => dayCellHtml(iso, byDate[iso], todayIso, account?.currency)).join('')}
      </div>
    </div>
  `;

  root.querySelector('#prev-month').addEventListener('click', () => {
    viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; }
    ctx.rerender();
  });
  root.querySelector('#next-month').addEventListener('click', () => {
    viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; }
    ctx.rerender();
  });

  root.querySelectorAll('[data-day-iso]').forEach((cell) => {
    cell.addEventListener('click', () => openDaySummary(ctx, cell.dataset.dayIso, byDate[cell.dataset.dayIso] || [], account?.currency));
  });
}

function groupByDate(trades) {
  const map = {};
  for (const t of trades) (map[t.date] ||= []).push(t);
  return map;
}

function dayCellHtml(iso, dayTrades, todayIso, currency) {
  if (!iso) return `<div class="calendar-day empty"></div>`;
  const dayNum = Number(iso.slice(-2));
  if (!dayTrades || dayTrades.length === 0) {
    return `<div class="calendar-day ${iso === todayIso ? 'today' : ''}" data-day-iso="${iso}"><span class="daynum">${dayNum}</span></div>`;
  }
  const pnl = dayTrades.reduce((s, t) => s + t.pnlCents, 0);
  const cls = pnl > 0 ? 'profit' : pnl < 0 ? 'loss' : 'breakeven';
  return `
    <div class="calendar-day ${cls} ${iso === todayIso ? 'today' : ''}" data-day-iso="${iso}">
      <span class="daynum">${dayNum}</span>
      <span class="daypnl num">${formatCents(pnl, currency)}</span>
    </div>
  `;
}

function openDaySummary(ctx, iso, dayTrades, currency) {
  if (dayTrades.length === 0) {
    ctx.openSheet(`<div class="card-title">${iso}</div><div class="field-hint">No Trades</div>`);
    return;
  }
  const wins = dayTrades.filter((t) => t.result === 'win').length;
  const losses = dayTrades.filter((t) => t.result === 'loss').length;
  const pnl = dayTrades.reduce((s, t) => s + t.pnlCents, 0);
  const best = dayTrades.reduce((a, b) => (b.pnlCents > a.pnlCents ? b : a));
  const worst = dayTrades.reduce((a, b) => (b.pnlCents < a.pnlCents ? b : a));
  const assets = [...new Set(dayTrades.map((t) => t.symbol))];

  ctx.openSheet(`
    <div class="card-title">Daily Summary — ${iso}</div>
    <div class="metric-grid">
      <div class="metric-cell"><div class="label">TRADES</div><div class="value num">${dayTrades.length}</div></div>
      <div class="metric-cell"><div class="label">P/L</div><div class="value num" style="color:${pnl >= 0 ? 'var(--safe)' : 'var(--danger)'}">${formatCents(pnl, currency)}</div></div>
      <div class="metric-cell"><div class="label">WINS</div><div class="value num">${wins}</div></div>
      <div class="metric-cell"><div class="label">LOSSES</div><div class="value num">${losses}</div></div>
      <div class="metric-cell"><div class="label">BEST TRADE</div><div class="value num" style="color:var(--safe)">${formatCents(best.pnlCents, currency)}</div></div>
      <div class="metric-cell"><div class="label">WORST TRADE</div><div class="value num" style="color:var(--danger)">${formatCents(worst.pnlCents, currency)}</div></div>
    </div>
    <div class="field-hint">Assets: ${assets.join(', ')}</div>
  `);
}

function equityCurveSvg(points, startingBalanceCents, rules) {
  if (points.length < 2) return `<div class="field-hint">Registra más trades para ver la curva.</div>`;
  const w = 480, h = 160, pad = 8;
  const values = points.map((p) => p.balanceCents);
  const min = Math.min(...values, startingBalanceCents);
  const max = Math.max(...values, startingBalanceCents);
  const range = max - min || 1;

  const toX = (i) => pad + (i / (points.length - 1)) * (w - pad * 2);
  const toY = (v) => h - pad - ((v - min) / range) * (h - pad * 2);

  const linePath = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${toX(i).toFixed(1)} ${toY(p.balanceCents).toFixed(1)}`).join(' ');
  const startY = toY(startingBalanceCents).toFixed(1);

  return `
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:140px;">
      <line x1="0" y1="${startY}" x2="${w}" y2="${startY}" stroke="var(--border-strong)" stroke-width="1" stroke-dasharray="4 4" />
      <path d="${linePath}" fill="none" stroke="var(--accent)" stroke-width="2" />
    </svg>
    <div class="field-hint">Línea punteada: starting balance. Curva: balance tras cada trade.</div>
  `;
}

function triButtons(value) {
  return `
    <button type="button" data-val="true" class="${value === true ? 'active' : ''}">SÍ</button>
    <button type="button" data-val="false" class="${value === false ? 'active' : ''}">NO</button>
    <button type="button" data-val="" class="${value === undefined ? 'active' : ''}">N/D</button>
  `;
}

function readTri(root, name) {
  const active = root.querySelector(`[data-tri="${name}"] button.active`);
  if (!active || active.dataset.val === '') return undefined;
  return active.dataset.val === 'true';
}

function downloadFile(filename, content, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function personalLimitMessage(personal, tradesToday) {
  if (!personal.maxTradesPerDay) return 'Sin límite personal de trades configurado.';
  if (tradesToday >= personal.maxTradesPerDay) return 'Personal trading limit reached.';
  return `${personal.maxTradesPerDay - tradesToday} trade(s) restante(s) según tu límite personal.`;
}

function endTradingDaySummary(account, todayTrades) {
  if (todayTrades.length === 0) {
    return `<div class="card field-hint">Aún no registraste trades hoy.</div>`;
  }
  const pnl = todayTrades.reduce((s, t) => s + t.pnlCents, 0);
  const wins = todayTrades.filter((t) => t.result === 'win').length;
  const losses = todayTrades.filter((t) => t.result === 'loss').length;
  const winRate = calculateWinRate(todayTrades);
  const best = todayTrades.reduce((a, b) => (b.pnlCents > a.pnlCents ? b : a));
  const worst = todayTrades.reduce((a, b) => (b.pnlCents < a.pnlCents ? b : a));

  return `
    <div class="card">
      <div class="metric-grid" style="margin-bottom:0;">
        <div class="metric-cell"><div class="label">DAILY P/L</div><div class="value num" style="color:${pnl >= 0 ? 'var(--safe)' : 'var(--danger)'}">${formatCents(pnl, account.currency)}</div></div>
        <div class="metric-cell"><div class="label">TRADES</div><div class="value num">${todayTrades.length}</div></div>
        <div class="metric-cell"><div class="label">WINS / LOSSES</div><div class="value num">${wins} / ${losses}</div></div>
        <div class="metric-cell"><div class="label">WIN RATE</div><div class="value num">${winRate.toFixed(0)}%</div></div>
        <div class="metric-cell"><div class="label">BEST TRADE</div><div class="value num" style="color:var(--safe)">${formatCents(best.pnlCents, account.currency)}</div></div>
        <div class="metric-cell"><div class="label">WORST TRADE</div><div class="value num" style="color:var(--danger)">${formatCents(worst.pnlCents, account.currency)}</div></div>
      </div>
    </div>
  `;
}

export function toast(message) {
  let el = document.getElementById('toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toast';
    el.className = 'toast';
    document.body.appendChild(el);

  el.textContent = message;
  el.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.display = 'none'; }, 2400);
}

export function openSheet(innerHTML, onMount) {
  closeSheet();
  const backdrop = document.createElement('div');
  backdrop.className = 'sheet-backdrop';
  backdrop.id = 'active-sheet';
  backdrop.innerHTML = `<div class="sheet"><div class="sheet-handle"></div><button class="sheet-close" data-close-sheet>${icons.close}</button>${innerHTML}</div>`;
  backdrop.addEventListener('click', (e) => {
    if (e.target === backdrop) closeSheet();
  });
  backdrop.querySelector('[data-close-sheet]').addEventListener('click', closeSheet);
  document.body.appendChild(backdrop);
  if (onMount) onMount(backdrop);
}

export function closeSheet() {
  const el = document.getElementById('active-sheet');
  if (el) el.remove();
}

function renderTabbar(activeRoute) {
  const tabsHtml = TABS.map((t) => {
    if (t.fab) {
      return `<div class="tab-item-fab"><button class="fab" data-nav="${t.route}">${t.icon}</button></div>`;
    }
    return `<button class="tab-item ${activeRoute === t.route ? 'active' : ''}" data-nav="${t.route}">${t.icon}<span>${t.label}</span></button>`;
  }).join('');
  return `<nav class="tabbar">${tabsHtml}</nav>`;
}

function attachTabbarEvents(container) {
  container.querySelectorAll('[data-nav]').forEach((btn) => {
    btn.addEventListener('click', () => navigate(btn.dataset.nav));
  });
}

const SCREENS_WITH_TABBAR = new Set(['home', 'calendar', 'add-trade', 'journal', 'analytics']);

export function render() {
  const { route, param } = currentRoute();
  const accounts = db.getAccounts();

  if (accounts.length === 0 && route !== 'new-account') {
    appRoot.innerHTML = '';
    renderOnboarding(appRoot, ctx);
    return;
  }

  let activeId = db.getActiveAccountId();
  if (!activeId || !db.getAccount(activeId)) {
    activeId = accounts[0]?.id ?? null;
    if (activeId) db.setActiveAccountId(activeId);
  }

  const screenContainer = document.createElement('div');

  switch (route) {
    case 'home':
      renderHome(screenContainer, ctx, activeId);
      break;
    case 'calendar':
      renderCalendar(screenContainer, ctx, activeId);
      break;
    case 'add-trade':
      renderAddTrade(screenContainer, ctx, activeId, null);
      break;
    case 'edit-trade':
      renderAddTrade(screenContainer, ctx, activeId, param);
      break;
    case 'journal':
      renderJournal(screenContainer, ctx, activeId);
      break;
    case 'analytics':
      renderAnalytics(screenContainer, ctx, activeId);
      break;
    case 'account-settings':
      renderAccountSettings(screenContainer, ctx, param || activeId);
      break;
    case 'trade':
      renderTradeDetail(screenContainer, ctx, param);
      break;
    case 'rule-events':
      renderRuleEvents(screenContainer, ctx, activeId);
      break;
    case 'accounts':
      renderAccountsOverview(screenContainer, ctx);
      break;
    case 'progress':
      renderProgress(screenContainer, ctx, activeId);
      break;
    case 'new-account':
      renderNewAccount(screenContainer, ctx);
      break;
    case 'daily-plan':
      renderDailyPlan(screenContainer, ctx, activeId);
      break;
    default:
      renderHome(screenContainer, ctx, activeId);
  }

  appRoot.innerHTML = '';
  appRoot.appendChild(screenContainer);

  if (SCREENS_WITH_TABBAR.has(route)) {
    const tabbarWrapper = document.createElement('div');
    tabbarWrapper.innerHTML = renderTabbar(route);
    appRoot.appendChild(tabbarWrapper.firstElementChild);
    attachTabbarEvents(appRoot);
  }

  window.scrollTo(0, 0);
}

window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', () => { render(); });


render();

</script>
</body>
</html>
